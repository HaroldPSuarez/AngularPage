<div class="favorites">
  <div class="favorites-header">
    <div class="container">
      <h1>Mis Favoritos</h1>
      <p>Tus vehículos clásicos guardados</p>
    </div>
  </div>

  <div class="favorites-content">
    <div class="container">
      <!-- Loading -->
      <div *ngIf="isLoading" class="loading">
        <mat-icon class="spin">refresh</mat-icon>
        <p>Cargando favoritos...</p>
      </div>

      <!-- Lista de favoritos -->
      <div *ngIf="!isLoading && favorites.length > 0" class="favorites-grid">
        <mat-card *ngFor="let car of favorites" class="favorite-card">
          <div class="card-image">
            <img [src]="car.image_url" [alt]="car.name" />
          </div>
          <div class="card-content">
            <h3>{{ car.brand }} {{ car.name }}</h3>
            <p class="year">{{ car.year }}</p>
            <div class="specs">
              <span>{{ car.horsepower }} HP</span>
              <span>{{ car.top_speed }}</span>
            </div>
            <p class="price">{{ car.price }}</p>
            <div class="card-actions">
              <button mat-raised-button color="primary" (click)="viewDetails(car.id)">
                Ver Detalles
              </button>
              <button mat-icon-button color="warn" (click)="removeFavorite(car.id)">
                <mat-icon>delete</mat-icon>
              </button>
            </div>
          </div>
        </mat-card>
      </div>

      <!-- Sin favoritos -->
      <div *ngIf="!isLoading && favorites.length === 0" class="empty-state">
        <mat-icon>favorite_border</mat-icon>
        <h3>No tienes favoritos aún</h3>
        <p>Explora nuestro catálogo y guarda tus carros favoritos</p>
        <button mat-raised-button color="primary" routerLink="/catalog">
          Explorar Catálogo
        </button>
      </div>
    </div>
  </div>
</div>
